<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BluSkyFinCorp Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <h1>BluSkyFinCorp Admin</h1>
          <p>Secure inquiry review and dashboard access.</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container admin-main">
    <section class="card admin-card">
      <h2>Admin login</h2>
      <p>Sign in with your admin credentials to view incoming inquiries.</p>
      <form id="loginForm" class="contact-form admin-login-form">
        <div class="form-row">
          <label for="adminUsername">Username</label>
          <input id="adminUsername" name="adminUsername" required />
        </div>
        <div class="form-row">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" name="adminPassword" type="password" required />
        </div>
        <button type="submit" class="button button-primary">Sign in</button>
      </form>
      <p id="adminMessage" class="form-response"></p>
    </section>

    <section id="dashboardSection" class="card admin-card admin-dashboard-hidden">
      <div class="section-header">
        <div>
          <h2>Recent inquiries</h2>
          <p>Review the latest incoming messages from visitors.</p>
        </div>
        <button id="logoutButton" class="button button-secondary">Log out</button>
      </div>
      <div id="inquiriesList"></div>
    </section>
  </main>

  <script>
    const loginForm = document.getElementById('loginForm');
    const adminMessage = document.getElementById('adminMessage');
    const dashboardSection = document.getElementById('dashboardSection');
    const inquiriesList = document.getElementById('inquiriesList');
    const logoutButton = document.getElementById('logoutButton');

    async function showInquiries() {
      try {
        const response = await fetch('/api/inquiries');
        if (!response.ok) {
          throw new Error('Unable to load inquiries.');
        }
        const data = await response.json();
        loginForm.style.display = 'none';
        dashboardSection.classList.remove('admin-dashboard-hidden');
        inquiriesList.innerHTML = '';

        if (!data.inquiries || data.inquiries.length === 0) {
          inquiriesList.innerHTML = '<p>No inquiries found yet.</p>';
          return;
        }

        data.inquiries.slice().reverse().forEach((inquiry) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'card inquiry-card';
          wrapper.innerHTML = `
            <h3>${inquiry.name}</h3>
            <p><strong>Email:</strong> ${inquiry.email}</p>
            <p><strong>Submitted:</strong> ${new Date(inquiry.createdAt).toLocaleString()}</p>
            <p>${inquiry.message.replace(/\n/g, '<br />')}</p>
          `;
          inquiriesList.appendChild(wrapper);
        });
      } catch (error) {
        adminMessage.textContent = error.message;
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      adminMessage.textContent = 'Signing in...';
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value.trim();

      try {
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.error || 'Login failed.');
        }

        adminMessage.textContent = 'Login successful! Loading inquiries...';
        await showInquiries();
      } catch (error) {
        adminMessage.textContent = error.message;
      }
    });

    logoutButton.addEventListener('click', async () => {
      await fetch('/admin/logout', { method: 'POST' });
      dashboardSection.classList.add('admin-dashboard-hidden');
      loginForm.style.display = 'block';
      adminMessage.textContent = 'Logged out successfully.';
    });

    showInquiries().catch(() => {});
  </script>
</body>
</html>
